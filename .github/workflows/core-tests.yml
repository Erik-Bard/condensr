name: Test condensr-core

on:
  push:
    paths:
      - "crates/condensr-core/**"
  pull_request:
    paths:
      - "crates/condensr-core/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check formatting
        run: cargo fmt --check -p condensr-core

  clippy:
    name: Run Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Clippy with warnings denied
        run: cargo clippy -p condensr-core --all-targets -- -D warnings

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: [format, clippy]

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test -p condensr-core
