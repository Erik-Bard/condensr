name: API CI

on:
  push:
    paths:
      - "apps/api/**"
      - "crates/condensr-core/**"
      - ".cargo/**"
      - ".github/workflows/api-tests.yml"
      - ".github/workflows/release.yml"
      - ".dockerignore"
      - "Cargo.lock"
      - "Cargo.toml"
      - "docker-compose.yml"
      - "rust-toolchain.toml"
  pull_request:
    paths:
      - "apps/api/**"
      - "crates/condensr-core/**"
      - ".cargo/**"
      - ".github/workflows/api-tests.yml"
      - ".github/workflows/release.yml"
      - ".dockerignore"
      - "Cargo.lock"
      - "Cargo.toml"
      - "docker-compose.yml"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check formatting
        run: cargo fmt --check -p condensr-api

      - name: Validate development Compose
        run: docker compose config --quiet

  clippy:
    name: Run Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Clippy with warnings denied
        run: cargo clippy -p condensr-api --all-targets -- -D warnings

  test:
    name: Run tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    needs: [format, clippy]

    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "17"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: condensr
          POSTGRES_PASSWORD: condensr
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U condensr -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgres://condensr:condensr@localhost:5432/postgres
        run: cargo test -p condensr-api
